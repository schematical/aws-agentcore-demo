version: 0.2

phases:
  pre_build:
    commands:
      - |
        extra_env_vars_json="$EXTRA_ENV_VARS"
        keys=$(echo "$extra_env_vars_json" | jq -r 'keys[]')
        for key in $keys; do
          value=$(echo "$extra_env_vars_json" | jq -r ".$key")
          export "$key"="$value"
        done
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

  build:
    commands:
      - cd $CODEBUILD_SRC_DIR/build
      - docker build --platform linux/arm64  -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - cd $CODEBUILD_SRC_DIR
      - echo Writing image definitions file...
      - printf '[{"name":"%s","imageUri":"%s"}]' $ECS_CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json
      - export IMAGE_URI=$REPOSITORY_URI:$IMAGE_TAG
      - |
        CURRENT=$(aws bedrock-agentcore-control get-agent-runtime --agent-runtime-id "$AGENT_RUNTIME_ID")
      - |
        ENV_VARS=$(echo "$CURRENT" | jq -c '.environmentVariables // {}')
      - |
        ROLE_ARN=$(echo "$CURRENT" | jq -r '.roleArn')
      - |
        NETWORK_CONFIG=$(echo "$CURRENT" | jq -c '.networkConfiguration')
      - |
        aws bedrock-agentcore-control update-agent-runtime \
        --agent-runtime-id "$AGENT_RUNTIME_ID" \
        --agent-runtime-artifact "{\"containerConfiguration\":{\"containerUri\":\"$IMAGE_URI\"}}" \
        --role-arn "$ROLE_ARN" \
        --network-configuration "$NETWORK_CONFIG" \
        --environment-variables "$ENV_VARS"
artifacts:
  files: imagedefinitions.json